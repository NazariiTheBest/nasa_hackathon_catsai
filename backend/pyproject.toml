[project]
name = "fieldshift"
version = "0.1.0"
description = "Field Shift: crop-rotation decision support with NASA Earth observations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16",
    "duckdb>=1.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
fieldshift = "fieldshift.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
