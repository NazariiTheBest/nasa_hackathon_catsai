# Field Shift crop knowledge base.
#
# Every agronomic judgment the tool makes reads from this file. Values marked
# `review_status: draft` were compiled from published tables and have NOT yet
# been checked by an agronomist; any strategy that uses a draft crop tells the
# farmer so. See docs/knowledge-base.md for the meaning and unit of each trait.
#
# Source keys used below:
#   FAO-56    Allen et al. 1998, "Crop evapotranspiration", FAO Irrigation and
#             Drainage Paper 56: Table 11 (stage lengths), Table 12 (crop
#             coefficients), Table 22 (rooting depth, depletion fraction).
#   ECOCROP   FAO ECOCROP database (temperature limits, growth cycle).
#   SARE      "Managing Cover Crops Profitably", 3rd ed., SARE 2007.
#   UA-164    Cabinet of Ministers of Ukraine resolution No. 164 of 11.02.2010
#             on crop-rotation norms (return intervals). To be confirmed.
#   DRAFT     Team estimate for Ukrainian conditions, awaiting review.

# ----------------------------- Winter cash crops -----------------------------

- id: winter_wheat
  name: {en: Winter wheat, uk: Пшениця озима}
  family: poaceae
  role: cash
  season: winter
  sowing_window_doy: [250, 288]        # 7 Sep - 15 Oct
  default_sow_doy: 268
  t_base_c: 0
  gdd_to_maturity: 1900
  stages_days: [160, 50, 55, 25]       # initial (incl. winter), development, mid, late
  kc: {ini: 0.4, mid: 1.15, end: 0.3}
  root_depth_m: 1.5
  depletion_fraction: 0.55
  stress:
    heat: {stage: mid, tmax_c: 32}
    frost: {stage: dev, tmin_c: -8}
    winterkill: {stage: ini, tmin_c: -20}
  drought_tolerance: 0.5
  n_fixation_kg_ha: 0
  residue_cover: 0.7
  forage_value: 0.1
  market_value: 0.75
  min_return_years: 2
  irrigation_required: false
  sources: ["FAO-56 Tables 11, 12, 22", "ECOCROP", "UA-164", "DRAFT"]
  review_status: draft

